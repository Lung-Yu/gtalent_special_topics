global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the helloworld app running locally (outside Docker)
  - job_name: 'helloworld'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8888']
        labels:
          app: 'helloworld'
          env: 'local'

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
